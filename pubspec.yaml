name: employee_id_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # ==========================================
  # Flutter & UI
  # ==========================================
  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter

  # ==========================================
  # Notifications
  # ==========================================
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.1

  # ==========================================
  # Firebase
  # ==========================================
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0

  # ==========================================
  # Supabase
  # ==========================================
  supabase_flutter: ^2.10.0

  # ==========================================
  # Icons & UI
  # ==========================================
  flutter_svg: ^2.0.10
  lucide_icons_flutter: ^3.1.21

  # ==========================================
  # State Management
  # ==========================================
  provider: ^6.1.2

  # ==========================================
  # Local Storage
  # ==========================================
  shared_preferences: ^2.2.2

  # ==========================================
  # File Import / Export
  # ==========================================
  file_picker: ^9.1.0
  excel: ^4.0.6
  path_provider: ^2.1.0

  # ==========================================
  # Web / Chrome
  # ==========================================
  universal_html: ^2.2.4

  # ==========================================
  # PDF
  # ==========================================
  pdf: ^3.12.0
  printing: ^5.14.3

  # ==========================================
  # File Saving
  # ==========================================
  file_saver: ^0.3.1
  flutter_timezone: 5.1.0

  # ==========================================
  # Hijri / Umm Al-Qura Calendar
  # ==========================================
  hijri_core: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/